[project]
name = "trading-ai-backend"
version = "0.1.0"
description = "AI Trading Assistant Platform — backend bootstrap (no business logic)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    # Already an fastapi[standard] transitive dependency (used by
    # TestClient) — declared explicitly now that market_data/gateway.py
    # depends on it directly for the Twelve Data HTTP client.
    "httpx>=0.27,<1",
    # Already an fastapi[standard] -> uvicorn[standard] transitive
    # dependency — declared explicitly now that
    # market_data/twelve_data_stream.py depends on it directly for the
    # Twelve Data WebSocket client. Tested against 17.0.1.
    "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "mypy>=1.13,<3",
    "alembic>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real, reachable PostgreSQL instance (opt-in, not run by default)",
    "live_provider: calls the real market-data provider over the network (opt-in, not run by default)",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]
