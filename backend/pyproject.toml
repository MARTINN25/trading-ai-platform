[project]
name = "trading-ai-backend"
version = "0.1.0"
description = "AI Trading Assistant Platform — backend bootstrap (no business logic)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.115,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "mypy>=1.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]
